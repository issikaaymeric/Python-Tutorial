name: Validate Python Path

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Python worker syntax
        run: node --check python-worker.js

      - name: Check inline application JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (scripts.length === 0) throw new Error('No inline application script found.');
          for (const [index, match] of scripts.entries()) {
            new vm.Script(match[1], { filename: 'index.html:inline-script-' + (index + 1) });
          }
          console.log('Validated ' + scripts.length + ' inline script(s).');
          NODE

      - name: Check required application files and features
        run: |
          test -f index.html
          test -f python-worker.js
          grep -q 'python-worker.js' index.html
          grep -q 'lessonFr' index.html
          grep -q 'projectFr' index.html
          grep -q 'localStorage' index.html
          echo "Required files and feature markers are present."
