d-template-columns:repeat(3,1fr);gap:12px;margin-bottom:32px}.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.stat strong{display:block;font-size:24px}.stat span{color:var(--muted);font-size:12px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:30px 0 14px}.section-head p{margin:0;color:var(--muted);font-size:13px}.lesson-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.lesson-card{padding:17px;cursor:pointer;transition:transform .18s,border-color .18s}.lesson-card:hover{transform:translateY(-3px);border-color:var(--blue)}.lesson-card .num{font-size:11px;color:var(--blue);font-weight:800;letter-spacing:.1em}.lesson-card p{color:var(--muted);font-size:13px;margin:7px 0 12px}.card-bottom{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.pill{padding:3px 8px;border-radius:20px;background:var(--panel2);color:var(--muted);font-size:11px}.pill.done{color:var(--green)}.workspace{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.9fr);gap:16px;align-items:start}.panel{padding:20px}.lesson-body{color:var(--muted)}.lesson-body p{margin:9px 0}.lesson-body ul{padding-left:20px}.callout{background:var(--panel2);border-left:3px solid var(--yellow);border-radius:8px;padding:12px 14px;margin:15px 0;color:var(--text)}.code-wrap{background:#09111d;border:1px solid #263750;border-radius:12px;overflow:hidden}.code-head{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#111c2e;color:#a9bad0;font-size:12px}.code-head button{background:#24354d;border:0;color:#fff;border-radius:7px;padding:5px 9px}.editor{width:100%;min-height:210px;resize:vertical;border:0;outline:0;background:#09111d;color:#e7edf7;padding:16px;font:13px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:4;white-space:pre}.runbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:11px}.run-status{color:var(--muted);font-size:12px}.output{margin-top:13px;background:#09111d;color:#d6e2f1;border:1px solid #263750;border-radius:10px;min-height:95px;padding:12px;font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap;overflow-wrap:anywhere}.output.error{color:#ff9999}.quiz-options{display:grid;gap:8px;margin:14px 0}.quiz-option{padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);text-align:left}.quiz-option.selected{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 12%,var(--panel2))}.feedback{padding:10px 12px;border-radius:9px;margin:10px 0;font-size:13px}.feedback.good{background:#0d382d;color:#8be4c3}.feedback.bad{background:#421f28;color:#ffb1b1}.complete-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:18px;padding-top:15px;border-top:1px solid var(--line)}.search{width:min(280px,40vw);background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 12px}.project-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.project-card{padding:17px}.project-card p{font-size:13px;color:var(--muted)}.project-card .level{font-size:11px;color:var(--blue);font-weight:800;text-transform:uppercase;letter-spacing:.1em}.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:12px}.footer{color:var(--muted);font-size:12px;margin-top:42px;text-align:center}.hidden{display:none!important}

<script>
const lessons = [
{id:"intro",title:"Getting started with Python",category:"Foundations",time:"8 min",description:"Understand Python, run your first program and read output.",body:`<p>Python is a readable, general-purpose programming language used for automation, web development, data analysis and artificial intelligence.</p><h3>Your first program</h3><p>The <code>print()</code> function displays information. Text values are written inside quotes.</p><div class="callout"><strong>Remember:</strong> Python executes instructions from top to bottom. Spelling, punctuation and indentation matter.</div><h3>Try changing the message</h3><p>Replace the example text with your name, then run the code.</p>`,code:'print("Hello, world!")\nprint("I am learning Python.")',quiz:{q:"Which function displays text in the Python console?",options:["show()","print()","writeLine()"],answer:1,why:"print() sends values to standard output."}},
{id:"variables",title:"Variables and data types",category:"Foundations",time:"12 min",description:"Store information and understand Python's core types.",body:`<p>A variable is a name that refers to a value. Python determines the type at runtime, so you do not declare it in advance.</p><ul><li><code>str</code> — text, such as <code>"Abidjan"</code></li><li><code>int</code> — whole numbers, such as <code>22</code></li><li><code>float</code> — decimal numbers, such as <code>3.14</code></li><li><code>bool</code> — <code>True</code> or <code>False</code></li></ul><div class="callout">Use descriptive <code>snake_case</code> names such as <code>student_name</code>.</div><p>Use <code>type(value)</code> to inspect a value's type.</p>`,code:'student_name = "Alex"\nage = 22\ngpa = 3.8\nis_enrolled = True\n\nprint(student_name)\nprint(type(age))\nprint(type(gpa))',quiz:{q:"What is the type of 3.8?",options:["int","str","float"],answer:2,why:"A number with a decimal point is a float."}},
{id:"operators",title:"Operators and expressions",category:"Foundations",time:"10 min",description:"Perform calculations and compare values.",body:`<p>Operators combine values into expressions.</p><ul><li>Arithmetic: <code>+ - * / // % **</code></li><li>Comparison: <code>== != > < >= <=</code></li><li>Logical: <code>and or not</code></li></ul><p>Notice the difference between <code>=</code> (assignment) and <code>==</code> (equality comparison).</p>`,code:'price = 1200\nquantity = 3\ntotal = price * quantity\n\nprint("Total:", total)\nprint(10 // 3)  # Floor division\nprint(10 % 3)   # Remainder',quiz:{q:"What does 17 % 5 return?",options:["3","2","3.4"],answer:1,why:"Modulo (%) returns the remainder. 17 divided by 5 leaves 2."}},
{id:"conditions",title:"Conditions and decisions",category:"Control flow",time:"12 min",description:"Make your program choose what to do with if, elif and else.",body:`<p>Conditional statements run different blocks depending on whether an expression is true or false.</p><p>Python uses indentation to define each block. Use four spaces consistently.</p><div class="callout">An <code>if</code> can be followed by zero or more <code>elif</code> branches and an optional <code>else</code>.</div>`,code:'score = 78\n\nif score >= 80:\n    print("Excellent")\nelif score >= 50:\n    print("Pass")\nelse:\n    print("Keep practicing")',quiz:{q:"Which keyword handles the final alternative branch?",options:["otherwise","else","default"],answer:1,why:"else runs when none of the preceding if/elif conditions are true."}},
{id:"loops",title:"Loops and iteration",category:"Control flow",time:"14 min",description:"Repeat work with for and while loops.",body:`<p>Loops repeat a block of code. Use <code>for</code> to iterate over a sequence and <code>while</code> to repeat while a condition remains true.</p><ul><li><code>range(5)</code> produces 0, 1, 2, 3, 4.</li><li><code>break</code> exits the loop.</li><li><code>continue</code> skips to the next iteration.</li></ul><p>Be careful that a while-loop condition eventually becomes false, otherwise it may never stop.</p>`,code:'total = 0\nfor number in range(1, 6):\n    total += number\n    print("Added:", number)\n\nprint("Sum:", total)',quiz:{q:"What values does range(1, 4) produce?",options:["1, 2, 3, 4","0, 1, 2, 3","1, 2, 3"],answer:2,why:"The start is included and the stop value (4) is excluded."}},
{id:"functions",title:"Functions",category:"Reusable code",time:"15 min",description:"Organize logic into reusable blocks with parameters and return values.",body:`<p>Functions help you give a name to a task, reuse it and test it independently.</p><ul><li><strong>Parameter:</strong> a variable in the function definition.</li><li><strong>Argument:</strong> a value passed when calling the function.</li><li><strong>return:</strong> sends a result back to the caller.</li></ul><div class="callout">A function that reaches the end without a return statement returns <code>None</code>.</div>`,code:'def calculate_total(price, quantity=1):\n    """Return the total price."""\n    return price * quantity\n\nsubtotal = calculate_total(250, 3)\nprint(subtotal)',quiz:{q:"What does return do?",options:["Displays text","Sends a value back to the caller","Repeats a function"],answer:1,why:"return ends the function call and provides its result to the caller."}},
{id:"collections",title:"Lists, tuples, sets and dictionaries",category:"Data structures",time:"16 min",description:"Choose the right collection for your data.",body:`<p>Python includes several useful built-in collections.</p><ul><li><strong>List:</strong> ordered and mutable — <code>[1, 2, 3]</code>.</li><li><strong>Tuple:</strong> ordered and immutable — <code>(1, 2, 3)</code>.</li><li><strong>Set:</strong> unique elements — <code>{1, 2, 3}</code>.</li><li><strong>Dictionary:</strong> key-value mapping — <code>{"name": "Ada"}</code>.</li></ul><p>Use dictionaries when you want to look up a value by a meaningful key.</p>`,code:'students = ["Ada", "Grace", "Linus"]\nstudents.append("Guido")\n\nprofile = {"name": "Ada", "language": "Python"}\nprint(students[0])\nprint(profile["language"])\nprint(len(set([1, 1, 2, 3])))',quiz:{q:"Which collection stores key-value pairs?",options:["List","Set","Dictionary"],answer:2,why:"A dictionary maps unique keys to values."}},
{id:"exceptions",title:"Exceptions and files",category:"Reliable programs",time:"18 min",description:"Handle errors and work safely with text and JSON files.",body:`<p>Exceptions represent errors that occur while a program runs. Handle only the errors you can reasonably recover from.</p><p>Use <code>try</code> and <code>except</code>, and use <code>finally</code> for cleanup that must happen either way.</p><p>For files, prefer <code>with open(...)</code>: it closes the file automatically. In this browser playground, file access is virtual to the Python runtime rather than your computer's disk.</p>`,code:'raw_age = "22"\n\ntry:\n    age = int(raw_age)\n    print("Next year:", age + 1)\nexcept ValueError:\n    print("Please enter a whole number.")\n\nwith open("notes.txt", "w") as file:\n    file.write("Learning Python!")\n\nwith open("notes.txt", "r") as file:\n    print(file.read())',quiz:{q:"Why use with open(...) when working with files?",options:["It makes files public","It closes the file automatically","It encrypts the file"],answer:1,why:"The context manager closes the file even if an exception occurs."}}
,
{id:"strings",title:"Strings and text processing",category:"Data handling",time:"12 min",description:"Format, inspect and transform text with string methods.",body:`<p>Strings are immutable sequences of Unicode characters. You can index, slice, search and format them.</p><ul><li><code>lower()</code> and <code>upper()</code> change letter case.</li><li><code>strip()</code> removes surrounding whitespace.</li><li><code>split()</code> separates text into a list.</li><li>f-strings insert values into readable text.</li></ul><div class="callout">String methods return new strings; they do not modify the original string in place.</div>`,code:'full_name = "  Ada Lovelace  "\nclean_name = full_name.strip()\nwords = clean_name.split()\n\nprint(clean_name.upper())\nprint(f"First name: {words[0]}")\nprint(f"Characters: {len(clean_name)}")',quiz:{q:"What does strip() do by default?",options:["Removes all spaces everywhere","Removes whitespace from the beginning and end","Changes text to lowercase"],answer:1,why:"strip() removes leading and trailing whitespace, not spaces inside the text."}},
{id:"oop",title:"Object-oriented programming",category:"Reusable code",time:"18 min",description:"Model real concepts with classes, objects, attributes and methods.",body:`<p>Object-oriented programming groups related data and behavior into objects.</p><ul><li>A <strong>class</strong> defines a kind of object.</li><li>An <strong>instance</strong> is an object created from a class.</li><li><code>__init__</code> initializes new instances.</li><li><code>self</code> refers to the current instance.</li></ul><p>Inheritance lets a class reuse or specialize behavior from another class. Prefer composition when a simple "has-a" relationship is clearer.</p>`,code:'class Student:\n    def __init__(self, name, grade):\n        self.name = name\n        self.grade = grade\n\n    def introduce(self):\n        return f"{self.name} has a grade of {self.grade}."\n\nstudent = Student("Ada", 92)\nprint(student.introduce())',quiz:{q:"What is a class in Python?",options:["A blueprint for creating objects","A loop that repeats code","A built-in data type only"],answer:0,why:"A class defines the attributes and behavior that its instances can have."}},
{id:"modules",title:"Modules, packages and imports",category:"Code organization",time:"12 min",description:"Reuse Python's standard library and organize code across files.",body:`<p>A module is a Python file. A package groups related modules. Imports let you reuse code instead of rewriting it.</p><ul><li><code>import math</code> imports a module.</li><li><code>from pathlib import Path</code> imports a specific name.</li><li><code>import pandas as pd</code> uses a conventional alias.</li></ul><div class="callout">Avoid <code>from module import *</code> because it can make names and their origins unclear.</div>`,code:'import math\nfrom datetime import date\n\nradius = 4\narea = math.pi * radius ** 2\nprint(f"Area: {area:.2f}")\nprint("Today:", date.today())',quiz:{q:"What is a Python module usually?",options:["A Python source file","A database table","A loop"],answer:0,why:"A module is commonly a .py file containing reusable definitions and statements."}},
{id:"quality",title:"Algorithms, testing and best practices",category:"Professional habits",time:"18 min",description:"Write readable code and check that it behaves as expected.",body:`<p>Good Python code is not only code that runs. It should also be understandable, testable and maintainable.</p><ul><li>Use clear names and consistent four-space indentation.</li><li>Break complex tasks into small functions.</li><li>Use docstrings and type hints where they clarify intent.</li><li>Test normal cases, edge cases and invalid input.</li><li>Use Git to track changes and collaborate.</li></ul><p>Unit tests make expected behavior repeatable. The standard library includes <code>unittest</code>; many Python projects also use <code>pytest</code>.</p>`,code:'def average(numbers):\n    """Return the arithmetic mean of a non-empty list."""\n    if not numbers:\n        raise ValueError("numbers cannot be empty")\n    return sum(numbers) / len(numbers)\n\nassert average([2, 4, 6]) == 4\nprint("Test passed!")\nprint(average([10, 20, 30]))',quiz:{q:"What is the purpose of a unit test?",options:["To make code run faster automatically","To check a small unit of behavior against an expectation","To replace documentation"],answer:1,why:"A unit test verifies that a focused piece of code behaves as expected."}}];
const projects=[
{title:"Personal profile card",level:"Beginner",desc:"Store your details in variables and print a neatly formatted profile.",tasks:["Create name, age and location variables.","Use an f-string to format the output.","Print each detail on a separate line."]},
{title:"Number analysis tool",level:"Beginner",desc:"Analyze a list of numbers using loops, conditions and built-in functions.",tasks:["Ask for or define a list of numbers.","Calculate the sum and average.","Find the minimum, maximum and even numbers."]},
{title:"Expense tracker",level:"Intermediate",desc:"Build a small command-line expense tracker using lists and dictionaries.",tasks:["Represent each expense with a dictionary.","Calculate total spending by category.","Handle invalid amounts with exceptions."]},
{title:"Contact book",level:"Intermediate",desc:"Create a contact manager with reusable functions.",tasks:["Add and list contacts.","Search by name.","Update or delete a contact."]},
{title:"CSV grade analyzer",level:"Advanced",desc:"Read structured records, calculate grades and summarize results.",tasks:["Load CSV data with Python's csv module.","Calculate class average and highest score.","Handle missing or malformed records."]},
{title:"API data explorer",level:"Advanced",desc:"Fetch JSON data from a public API and transform it into a useful report.",tasks:["Understand JSON objects and arrays.","Parse a response using json.","Validate missing fields and handle errors."]}
];
let state=loadState(),currentLesson=lessons[0].id,selectedAnswer=null,quizFeedback=null,worker=null,runId=0,runTimer=null;
function loadState(){try{return JSON.parse(localStorage.getItem("pythonPathProgress"))||{completed:[],scores:{},theme:"dark"}}catch{return{completed:[],scores:{},theme:"dark"}}}
function saveState(){localStorage.setItem("pythonPathProgress",JSON.stringify(state));updateProgress()}
function percent(){return Math.round(state.completed.length/lessons.length*100)}
function updateProgress(){const p=percent();document.getElementById("sidePercent").textContent=p+"%";document.getElementById("sideFill").style.width=p+"%";document.getElementById("sideCount").textContent=state.completed.length+" of "+lessons.length+" lessons completed"}
function setView(view){document.querySelectorAll(".nav-item[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view===view));document.getElementById("sidebar").classList.remove("open");const names={home:"Overview",lessons:"Learning path",playground:"Python playground",projects:"Projects",progress:"My progress"};document.getElementById("breadcrumb").textContent="Learning space / "+(names[view]||"Lesson");if(view==="home")renderHome();if(view==="lessons")renderLessons();if(view==="playground")renderPlayground();if(view==="projects")renderProjects();if(view==="progress")renderProgress();window.scrollTo({top:0,behavior:"smooth"})}
function renderHome(){const next=lessons.find(l=>!state.completed.includes(l.id))||lessons[0];document.getElementById("viewRoot").innerHTML=`<section class="hero"><div class="hero-copy"><div class="eyebrow">Your Python learning journey</div><h1>Learn Python.<br>Build something real.</h1><p class="lead">A practical path from your first print statement to reliable programs. Learn one concept, run the code, test your understanding and build projects.</p><div class="hero-buttons"><button class="primary" id="continueBtn">Continue learning →</button><button class="secondary" id="allLessonsBtn">Explore lessons</button></div></div><div class="hero-card"><div class="python">🐍</div><strong>Practice, not just reading.</strong><p>Run Python in your browser, get instant feedback and keep your progress on this device.</p></div></section><section class="stats"><div class="stat"><strong>${lessons.length}</strong><span>Core lessons</span></div><div class="stat"><strong>${state.completed.length}</strong><span>Lessons completed</span></div><div class="stat"><strong>${percent()}%</strong><span>Course progress</span></div></section><div class="section-head"><div><h2>Learning path</h2><p>Start with the foundations and move at your own pace.</p></div><button class="ghost" id="viewAllBtn">View all →</button></div><div class="lesson-grid">${lessons.slice(0,6).map(lessonCard).join("")}</div><div class="section-head"><div><h2>Build your skills</h2><p>Use what you learn in small, practical projects.</p></div><button class="ghost" id="projectsBtn">Explore projects →</button></div><div class="project-grid">${projects.slice(0,3).map(projectCard).join("")}</div><div class="footer">Built by Issika Aymeric Kouamé · Keep learning, keep building.</div>`;
document.getElementById("continueBtn").onclick=()=>openLesson(next.id);document.getElementById("allLessonsBtn").onclick=()=>setView("lessons");document.getElementById("viewAllBtn").onclick=()=>setView("lessons");document.getElementById("projectsBtn").onclick=()=>setView("projects");wireLessonCards()}
function lessonCard(l){const done=state.completed.includes(l.id);return `<article class="lesson-card" data-lesson="${l.id}" tabindex="0"><div class="num">LESSON ${String(lessons.indexOf(l)+1).padStart(2,"0")} · ${l.category.toUpperCase()}</div><h3 style="margin-top:9px">${l.title}</h3><p>${l.description}</p><div class="card-bottom"><span>${l.time}</span><span class="pill ${done?"done":""}">${done?"✓ Completed":"Start lesson →"}</span></div></article>`}
function projectCard(p){return `<article class="project-card"><div class="level">${p.level} project</div><h3 style="margin-top:8px">${p.title}</h3><p>${p.desc}</p></article>`}
function wireLessonCards(){document.querySelectorAll("[data-lesson]").forEach(card=>{card.onclick=()=>openLesson(card.dataset.lesson);card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openLesson(card.dataset.lesson)}}})}
function renderLessons(filter=""){const filtered=lessons.filter(l=>(l.title+" "+l.description+" "+l.category).toLowerCase().includes(filter.toLowerCase()));document.getElementById("viewRoot").innerHTML=`<div class="eyebrow">Curriculum</div><h1 style="font-size:36px">Learning path</h1><p class="lead">Focused lessons from the foundations to professional coding habits. Each includes a runnable example and a knowledge check.</p><div class="section-head"><div><h2>All lessons</h2><p>${filtered.length} lessons found</p></div></div><div class="lesson-grid">${filtered.map(lessonCard).join("")||'<div class="empty">No lessons match your search.</div>'}</div>`;wireLessonCards()}
function openLesson(id){currentLesson=id;const l=lessons.find(x=>x.id===id);selectedAnswer=null;quizFeedback=null;document.getElementById("breadcrumb").textContent="Learning space / "+l.title;document.querySelectorAll(".nav-item[data-view]").forEach(b=>b.classList.toggle("active",b.dataset.view==="lessons"));document.getElementById("viewRoot").innerHTML=`<button class="ghost" id="backLessons" style="margin-bottom:18px">← All lessons</button><div class="eyebrow">Lesson ${lessons.indexOf(l)+1} · ${l.category} · ${l.time}</div><h1 style="font-size:36px">${l.title}</h1><p class="lead">${l.description}</p><div class="workspace" style="margin-top:22px"><section class="panel"><div class="lesson-body">${l.body}</div><div class="complete-row"><span style="color:var(--muted);font-size:13px">${state.completed.includes(id)?"You completed this lesson.":"Mark this lesson complete when you are ready."}</span><button class="primary" id="completeBtn">${state.completed.includes(id)?"✓ Completed":"Mark complete"}</button></div></section><div style="display:grid;gap:14px"><section class="panel"><h2>Try it yourself</h2><p style="color:var(--muted);font-size:13px">Edit the code, then run it. Python executes in your browser.</p>${editorMarkup(l.code)}</section><section class="panel" id="quizPanel"><div class="eyebrow">Knowledge check</div><h3>${l.quiz.q}</h3><div class="quiz-options">${l.quiz.options.map((o,i)=>`<button class="quiz-option" data-answer="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div><div id="quizFeedback"></div><button class="secondary" id="checkAnswer">Check answer</button></section></div></div><div class="section-head"><div><h2>Next lesson</h2><p>Keep your momentum going.</p></div><button class="ghost" id="nextLesson">Next →</button></div>`;
document.getElementById("backLessons").onclick=()=>setView("lessons");document.getElementById("completeBtn").onclick=()=>{if(!state.completed.includes(id))state.completed.push(id);saveState();openLesson(id)};document.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{selectedAnswer=Number(b.dataset.answer);document.querySelectorAll("[data-answer]").forEach(x=>x.classList.toggle("selected",x===b))});document.getElementById("checkAnswer").onclick=()=>checkQuiz(l);document.getElementById("nextLesson").onclick=()=>{const n=lessons[(lessons.indexOf(l)+1)%lessons.length];openLesson(n.id)};wireEditor()}
function editorMarkup(code){return `<div class="code-wrap"><div class="code-head"><span>main.py</span><button class="reset-code">Reset code</button></div><textarea class="editor" id="codeEditor" spellcheck="false" aria-label="Python code editor">${escapeHtml(code)}</textarea></div><div class="runbar"><button class="primary run-code">▶ Run code</button><span class="run-status" id="runStatus">Python runtime loads when you first run code.</span></div><div class="output" id="codeOutput" aria-live="polite">Output will appear here…</div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function wireEditor(){const editor=document.getElementById("codeEditor");if(!editor)return;document.querySelector(".reset-code").onclick=()=>{editor.value=lessons.find(l=>l.id===currentLesson)?.code||'print("Hello, Python!")';document.getElementById("codeOutput").textContent="Output will appear here…"};document.querySelector(".run-code").onclick=()=>runCode(editor.value);editor.addEventListener("keydown",e=>{if(e.key==="Tab"){e.preventDefault();const a=editor.selectionStart,b=editor.selectionEnd;editor.setRangeText("    ",a,b,"end")}if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){e.preventDefault();runCode(editor.value)}})}
function checkQuiz(l){if(selectedAnswer===null){document.getElementById("quizFeedback").innerHTML='<div class="feedback bad">Choose an answer first.</div>';return}const ok=selectedAnswer===l.quiz.answer;state.scores[l.id]=ok?1:0;saveState();document.getElementById("quizFeedback").innerHTML=`<div class="feedback ${ok?"good":"bad"}">${ok?"Correct!":"Not quite."} ${l.quiz.why}</div>`}
function ensureWorker(){if(worker)return worker;worker=new Worker("./python-worker.js");worker.onmessage=e=>{const m=e.data;if(m.id!==runId)return;const output=document.getElementById("codeOutput");const status=document.getElementById("runStatus");if(m.type==="stdout"||m.type==="stderr"||m.type==="result"){if(output.textContent==="Running…"||output.textContent==="Output will appear here…")output.textContent="";output.textContent+=(m.text||"")+(m.type==="result"?"\n":"")}if(m.type==="status")status.textContent=m.message;if(m.type==="error"){clearTimeout(runTimer);output.classList.add("error");output.textContent+="Error: "+m.text;status.textContent="Execution failed"}if(m.type==="done"){clearTimeout(runTimer);status.textContent="Execution finished";if(!output.textContent)output.textContent="Program finished with no output."}};worker.onerror=()=>{document.getElementById("runStatus").textContent="Python worker failed to load. Refresh and try again."};return worker}
function runCode(code){const output=document.getElementById("codeOutput"),status=document.getElementById("runStatus");output.classList.remove("error");output.textContent="Running…";status.textContent="Starting Python…";runId++;const id=runId;try{ensureWorker().postMessage({id,code})}catch(e){output.textContent="Unable to start Python: "+e.message;return}clearTimeout(runTimer);runTimer=setTimeout(()=>{if(worker){worker.terminate();worker=null}output.classList.add("error");output.textContent="Execution stopped: time limit reached (10 seconds). Check for an infinite loop and try again.";status.textContent="Execution timed out";runId++},10000)}
function renderPlayground(){document.getElementById("breadcrumb").textContent="Learning space / Python playground";document.getElementById("viewRoot").innerHTML=`<div class="eyebrow">Practice lab</div><h1 style="font-size:36px">Python playground</h1><p class="lead">Experiment freely. Your code runs in a browser-based Python runtime; no account or server is required.</p><div class="panel" style="margin-top:22px"><h2>Write and run Python</h2><p style="color:var(--muted);font-size:13px">Try changing the sample, then select Run. The first run downloads the Python runtime and may take a little longer.</p>${editorMarkup('name = "Python learner"\nfor number in range(1, 4):\n    print(f"{number}. Hello, {name}!")')}</div><div class="callout" style="margin-top:15px">This playground is designed for learning. It runs in a browser worker with a short execution limit. It does not provide access to your computer's files or a full server environment.</div>`;wireEditor()}
function renderProjects(){document.getElementById("viewRoot").innerHTML=`<div class="eyebrow">Apply what you learn</div><h1 style="font-size:36px">Practical projects</h1><p class="lead">Build small applications to turn concepts into working skills. Start with the requirements and add features as you improve.</p><div class="project-grid" style="margin-top:22px">${projects.map(p=>`<article class="project-card"><div class="level">${p.level}</div><h3 style="margin-top:8px">${p.title}</h3><p>${p.desc}</p><strong style="font-size:12px">Requirements</strong><ul style="padding-left:18px;color:var(--muted);font-size:13px">${p.tasks.map(t=>`<li>${t}</li>`).join("")}</ul></article>`).join("")}</div>`}
function renderProgress(){document.getElementById("viewRoot").innerHTML=`<div class="eyebrow">Your learning</div><h1 style="font-size:36px">My progress</h1><p class="lead">Your progress is saved in this browser on this device.</p><div class="stats" style="margin-top:22px"><div class="stat"><strong>${percent()}%</strong><span>Course completion</span></div><div class="stat"><strong>${state.completed.length}/${lessons.length}</strong><span>Lessons completed</span></div><div class="stat"><strong>${Object.values(state.scores).filter(Boolean).length}</strong><span>Quiz answers correct</span></div></div><div class="panel"><h2>Lesson checklist</h2>${lessons.map(l=>`<div class="complete-row"><span>${l.title}</span><span class="pill ${state.completed.includes(l.id)?"done":""}">${state.completed.includes(l.id)?"✓ Completed":"Not completed"}</span></div>`).join("")}</div>`}
document.querySelectorAll(".nav-item[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));document.getElementById("menuBtn").onclick=()=>document.getElementById("sidebar").classList.toggle("open");document.getElementById("themeBtn").onclick=()=>{document.documentElement.classList.toggle("light");state.theme=document.documentElement.classList.contains("light")?"light":"dark";saveState()};document.getElementById("resetProgress").onclick=()=>{if(confirm("Reset all lesson completion and quiz progress on this device?")){state.completed=[];state.scores={};saveState();setView("home")}};document.getElementById("searchInput").addEventListener("input",e=>{if(document.querySelector('.nav-item[data-view="lessons"]').classList.contains("active"))renderLessons(e.target.value);else if(e.target.value.trim()){setView("lessons");document.getElementById("searchInput").value=e.target.value;renderLessons(e.target.value)}});if(state.theme==="light")document.documentElement.classList.add("light");updateProgress();renderHome();
</script>
</body>
</html>
